<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PolDivers</title>
  <meta name="description" content="Nieoficjalny towarzysz Helldivers 2: mapa galaktyki, fronty, rozkazy, kampanie wojenne i DSS — to samo co aplikacja PolDivers.">
  <meta name="theme-color" content="#0B0D10">
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="nav"><nav id="tabs"></nav></aside>
    <main class="main">
      <header class="topbar">
        <img class="logo" src="assets/logo.png" alt="">
        <div class="titles"><div class="brand">POLDIVERS</div><div id="title" class="headline-s glow">PLANETY</div></div>
        <div class="live" id="live"><span class="ldot"></span><span id="live-text">łączenie…</span></div>
        <button class="icon-btn" id="settings" title="Ustawienia">⚙</button>
      </header>
      <div class="topline"></div>
      <section id="view" class="view"></section>
    </main>
  </div>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer">
    <button class="drawer-close" id="drawer-close" aria-label="Zamknij">×</button>
    <div id="drawer-body"></div>
  </aside>
  <script type="module" src="js/app.js"></script>
</body>
</html>
