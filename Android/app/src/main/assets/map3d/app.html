<!doctype html>
<!-- Host page of the 3D map inside the Android app (feature/planets/GalaxyMap3D.kt). The app feeds
     it the map model and gets taps back through the "PolDivers" JavaScript interface. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; background: #07090c; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #map { position: absolute; inset: 0; }
  #err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: #9AA0A8; font: 14px sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="err"></div>
<script>
  // Any script error ends up in the app's log and, while no map is up, on screen.
  let reported = 0;
  function report(msg) {
    if (++reported > 5) return; // a broken frame loop would repeat it 60x a second
    try { window.PolDivers && window.PolDivers.onError(String(msg)); } catch (e) {}
    const box = document.getElementById("err");
    if (box && !window.PD3D) { box.style.display = "flex"; box.textContent = "3D: " + msg; }
  }
  window.addEventListener("error", (e) => report((e.message || "error") + (e.filename ? " @ " + e.filename.split("/").pop() + ":" + e.lineno : "")));
  window.addEventListener("unhandledrejection", (e) => report(e.reason && e.reason.message ? e.reason.message : String(e.reason)));
</script>
<script type="module">
  const bridge = window.PolDivers;
  const guard = (fn) => (...args) => { try { return fn(...args); } catch (e) { report(e.message); } };
  try {
    const { Galaxy3D, webglAvailable } = await import("./galaxy3d.js");
    if (!webglAvailable()) throw new Error("WebGL");
    const g = new Galaxy3D(document.getElementById("map"), {
      anim: bridge ? bridge.animations() : true,
      focusShift: 0.2,
      onSelect: (p) => bridge?.onSelect(p.i),
    });
    window.PD3D = {
      setModel: guard((m) => g.setModel(m)),
      setHideOurs: (v, animate) => g.setHideOurs(v, animate !== false),
      setAnim: (v) => g.setAnim(v),
      focus: (i) => g.focus(i),
      deselect: () => g.deselect(),
      reset: () => g.reset(),
      rotateBy: (a) => g.rotateBy(a),
      tiltBy: (d) => g.tiltBy(d),
    };
    bridge?.onReady();
  } catch (e) {
    const box = document.getElementById("err");
    box.style.display = "flex";
    box.textContent = "3D map unavailable: " + e.message;
    bridge?.onFailed(String(e.message));
  }
</script>
</body>
</html>
