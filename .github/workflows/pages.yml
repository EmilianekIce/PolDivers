name: Website

on:
  push:
    branches: [main]
    paths:
      - "Web/**"
      - "Android/app/src/main/assets/**"
      - "Android/tools/build_web_data.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # The site shares the app's assets (icons, planet art, war data): copied in at build time.
      - name: Build site
        run: |
          mkdir _site
          cp -r Web/* _site/
          python3 Android/tools/build_web_data.py _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
