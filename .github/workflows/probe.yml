name: API probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          B=https://api.live.prod.thehelldiversgame.com
          S() { curl -s -H "Accept-Language: en-US" $B/api/WarSeason/801/Status; }
          S > s0.json; sleep 5; S > s5.json; sleep 15; S > s20.json; sleep 25; S > s45.json
          python3 - <<'PY'
          import json
          snaps=[json.load(open(f)) for f in ['s0.json','s5.json','s20.json','s45.json']]
          camp=[c['planetIndex'] for c in snaps[0]['campaigns']]
          print('time', [s['time'] for s in snaps])
          for idx in camp[:8]:
              hs=[next(p['health'] for p in s['planetStatus'] if p['index']==idx) for s in snaps]
              ev=[next((e['health'] for e in s['planetEvents'] if e['planetIndex']==idx),None) for s in snaps]
              rg=next(p['regenPerSecond'] for p in snaps[0]['planetStatus'] if p['index']==idx)
              print(idx,'health',hs,'event',ev,'regen',rg)
          open('camp.txt','w').write(str(camp[0]))
          PY
          I=$(cat camp.txt)
          for u in "https://helldiverstrainingmanual.com/api/v1/war/campaign" "https://helldiverstrainingmanual.com/api/v1/war/history/$I?timeframe=short" "https://helldiverstrainingmanual.com/api/v1/war/history/$I" "https://api.diveharder.com/v1/all" "https://api.diveharder.com/v1/planets" ; do
            curl -s -L -A "PolDivers-probe" -o o.json -w "$u -> %{http_code} %{time_total}s %{size_download}B\n" "$u"
            head -c 900 o.json; echo; echo -----
          done
