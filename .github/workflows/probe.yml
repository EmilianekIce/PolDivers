name: API probe
on: push
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Endpoints
        run: |
          H=(-H "X-Super-Client: poldivers-web" -H "X-Super-Contact: probe" -H "Accept-Language: pl-PL" -H "Origin: https://emilianekice.github.io")
          mkdir -p fixtures2
          for u in \
            "https://helldiverstrainingmanual.com/api/v1/war/news" \
            "https://helldiverstrainingmanual.com/api/v1/war/info" \
            "https://helldiverstrainingmanual.com/api/v1/war/major-orders" \
            "https://helldiverstrainingmanual.com/api/v1/war/campaign" \
            "https://helldiverstrainingmanual.com/api/v1/planets" \
            "https://api.helldivers2.dev/raw/api/NewsFeed/801" \
            "https://api.helldivers2.dev/api/v1/dispatches" \
            "https://api.helldivers2.dev/api/v2/dispatches" \
            "https://api.helldivers2.dev/api/v1/assignments" \
            "https://api.helldivers2.dev/api/v2/space-stations" \
            "https://api.helldivers2.dev/raw/api/WarSeason/801/WarInfo" ; do
            n=$(echo "$u" | sed 's#https://##; s#[/?=&]#_#g')
            curl -s -D h.txt "${H[@]}" -o fixtures2/$n.json -w "$u -> %{http_code} %{time_total}s %{size_download}B " "$u"
            grep -i "access-control-allow-origin" h.txt | tr -d '\r' || echo "(no CORS)"
            head -c 300 fixtures2/$n.json; echo; echo
          done
          find fixtures2 -size +300k -delete
          git config user.email noreply@anthropic.com && git config user.name Claude
          git add fixtures2 && git commit -m "fixtures2 [skip ci]" && git push
